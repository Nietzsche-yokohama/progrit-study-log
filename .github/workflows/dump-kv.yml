name: Dump PROGRIT_KV (one-off, read-only)

on:
  workflow_dispatch:
  push:
    branches: [claude/restore-first-cycle-day-48-medtom]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Read progrit_master_v7 from KV (no writes)
        run: |
          npx wrangler kv key get progrit_master_v7 --namespace-id=b9911ef74511411ba5c72b1071fcee9e --remote > master.json
          node -e "
            const m = JSON.parse(require('fs').readFileSync('master.json','utf8'));
            console.log('days:', m.days.length, 'lastMsgTs:', m.lastMsgTs, 'savedAt:', new Date(m.savedAt).toISOString());
            for (const d of m.days) console.log(JSON.stringify(d));
          "
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: progrit-master
          path: master.json
