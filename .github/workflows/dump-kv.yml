name: Dump PROGRIT_KV (one-off, read-only)

on:
  workflow_dispatch:
  push:
    branches: [claude/restore-first-cycle-day-48-medtom]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Look for an older copy of progrit_master_v7 in other KV namespaces (no writes)
        run: |
          npx wrangler kv namespace list > namespaces.json
          cat namespaces.json
          for id in $(node -e "for (const n of JSON.parse(require('fs').readFileSync('namespaces.json','utf8'))) console.log(n.id)"); do
            echo "=== namespace $id"
            npx wrangler kv key list --namespace-id="$id" 2>/dev/null | node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const ks=JSON.parse(s);console.log('keys:',ks.map(k=>k.name).filter(n=>/progrit/i.test(n)).join(', ')||'(none matching progrit)');}catch(e){console.log('list failed')}})
            " || true
            if npx wrangler kv key get progrit_master_v7 --namespace-id="$id" --remote > m.json 2>/dev/null && [ -s m.json ]; then
              node -e "
                const m = JSON.parse(require('fs').readFileSync('m.json','utf8'));
                console.log('progrit_master_v7 found: days', m.days.length, 'savedAt', new Date(m.savedAt).toISOString(), 'lastMsgTs', m.lastMsgTs);
                for (const d of m.days) if (d.d >= 43 && d.d <= 52) console.log(JSON.stringify(d));
              " || true
            else
              echo "no progrit_master_v7 here"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
