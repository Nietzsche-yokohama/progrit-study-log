name: Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Pages project exists
        run: npx wrangler pages project create progrit-study-log --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Pages
        # コミットメッセージは固定のASCII文字列で上書きする。
        # gitのコミットメッセージ（絵文字・日本語）をそのまま送るとCloudflareが
        # マルチバイト文字の途中で切り詰めて「Invalid commit message」エラーになるため。
        run: npx wrangler pages deploy public --project-name=progrit-study-log --branch=main --commit-message="Deploy from GitHub Actions"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy worker/index.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set SLACK_BOT_TOKEN worker secret
        run: |
          if [ -n "$SLACK_BOT_TOKEN" ]; then
            echo "$SLACK_BOT_TOKEN" | npx wrangler secret put SLACK_BOT_TOKEN
          else
            echo "SLACK_BOT_TOKEN not set in GitHub Secrets — skipping"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Set APP_TOKEN worker secret
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "$APP_TOKEN" | npx wrangler secret put APP_TOKEN
          else
            echo "APP_TOKEN not set in GitHub Secrets — skipping (API stays open until it is set)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
